{% load crispy_forms_tags %}
<form method="post" action="{% if assignment_url %}{{ assignment_url }}{% else %}{% url 'automotive:bulk_fitments' %}{% endif %}" id="bulk-fitments-form" novalidate>
    {% csrf_token %}
    <p class="text-muted small">{{ assignment_help|default:DLUX_STRINGS.fits_bulk_help|default:"Pick the products, then the vehicles they all fit. Existing compatibility is kept." }}</p>
    {% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
    {% crispy form %}
    <div class="d-flex justify-content-end gap-2" data-dlux-modal-footer>
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">{{ DLUX_STRINGS.ui_cancel|default:"Cancel" }}</button>
        <button type="submit" form="bulk-fitments-form" class="btn btn-primary rounded-pill px-4"><i class="bi {{ assignment_icon|default:"bi-car-front" }} me-1"></i>{{ assignment_label|default:DLUX_STRINGS.fits_bulk_apply|default:"Add vehicles" }}</button>
    </div>
</form>
