<article class="vehicle-product-card">
                <button type="button" class="vehicle-product-open" data-dynamic-modal="{% url 'catalog:product_card' product.pk %}" data-modal-title="{{ product.name }}">
                    <span class="vehicle-product-image">
                        {% if product.image_url %}<img src="{{ product.image_url }}" alt="">{% else %}<i class="bi bi-box-seam"></i>{% endif %}
                    </span>
                    <span class="vehicle-product-body">
                        <span class="vehicle-product-name">{{ product.name }}</span>
                        {% if product.alias %}<span class="vehicle-product-meta">{{ product.alias }}</span>{% endif %}
                        <span class="vehicle-product-meta">{{ product.category|default:"—" }}{% if product.sku %} · <span class="font-monospace">{{ product.sku }}</span>{% endif %}</span>
                        <span class="vehicle-product-footer">
                            <strong>{{ product.browser_price_lyd|floatformat:2 }} LYD</strong>
                            {% if product.stock_qty <= 0 %}<span class="badge text-bg-danger">{{ DLUX_STRINGS.ui_out_of_stock|default:"Out of stock" }}</span>{% elif product.is_low_stock %}<span class="badge text-bg-warning">{{ DLUX_STRINGS.ui_low_stock|default:"Low stock" }}</span>{% else %}<span class="badge text-bg-success">{{ product.stock_qty|floatformat:"-2" }} {{ product.get_unit_display }}</span>{% endif %}
                        </span>
                    </span>
                </button>
            </article>
